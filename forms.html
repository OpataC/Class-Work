<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us </title>
     <link rel="stylesheet" href="Static/CSS/forms.css">
</head>
<body>
    <h2 id="hello">Contact us</h2>
    <form id="myform">
       <label for="name">Fullname:</label>

       <input type="text" id="fullname" name="fullname" placeholder="enter your fullname" required><br><br>

       <label for="email">Email</label>

        <input type="email" id="email" name="email" placeholder="enter your email" required><br><br>

        <label for="Phone">Phone Number</label>
        <input type="Phone" id="Phone" name="">
    
       <label for="Message">Message:</label><br>

       <textarea name="Message" id="Message" rows="5"></textarea><br><br>

        <input type="submit" value="send Message" required>

    </form>


</body>
</html>
